<!--
  PURPOSE
    Dedicated project page. Every card on projects.html / the home page's
    featured strip now links here (project.html?id=<slug>) instead of
    straight to GitHub.

  PHASE NOTE
    This is the Phase 2 foundation for Phase 3's full per-project case
    studies (Problem → Research → Design → ... → Lessons Learned, with
    real static URLs like /projects/formula-water/). For now it's a single
    template that renders whatever projects.json has for the requested id:
    hero, overview, tags, and links. No hand-editing needed per project —
    add richer fields to projects.json and render-project-detail.js will
    pick them up.

  DEPENDENCIES
    assets/css/{tokens,base,layout,components,pages,micro-interactions}.css
    assets/js/main.js (renders the project via render-project-detail.js)

  SAFE EDITS
    Do NOT hand-edit project content here — edit assets/data/projects.json.
    This file only provides the empty containers the renderer populates.
-->
