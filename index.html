    assets/css/{tokens,base,layout,components,pages,micro-interactions}.css

      also drives cursor/magnetic/tilt fx and the hero text-decode effect)

    Copy edits: hero name/role/lede text below, and the CTA button labels.
    Keep the hero name wrapped in <span data-decode> — that's what
    text-decode.js scrambles/resolves on load; editing the text inside it
    is fine, removing the attribute just turns the effect off.
    Do NOT hand-edit the featured project cards — they're generated from
    assets/data/projects.json; edit that file instead.
-->
