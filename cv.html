<!--
  PURPOSE
    Full online résumé / CV page. Renders assets/data/cv.json into a
    complete, printable professional profile: summary, education,
    experience, technical skills, projects, awards, certifications,
    languages, and interests — plus a Download CV (PDF) button and a
    Print version button.

  DEPENDENCIES
    assets/css/{tokens,base,layout,components,pages,micro-interactions,cv}.css
    assets/js/main.js (renders assets/data/cv.json via render-cv.js)

  SAFE EDITS
    Do NOT hand-edit CV content here — edit assets/data/cv.json instead;
    this page only provides the container the renderer populates.
    To wire up a real PDF, drop it at assets/documents/cv-pedro-sousa.pdf
    (or update the two hrefs below to point wherever it actually lives).
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV — Pedro Sousa</title>
  <meta name="description" content="Online résumé of Pedro Sousa: education, technical skills, projects, and awards, with a downloadable PDF version.">
  <link rel="canonical" href="https://pedrosousaeng.github.io/portfolio/cv.html">

  <meta property="og:type" content="website">
  <meta property="og:title" content="CV — Pedro Sousa">
  <meta property="og:description" content="Online résumé: education, technical skills, projects, and awards, with a downloadable PDF version.">
  <meta property="og:url" content="https://pedrosousaeng.github.io/portfolio/cv.html">
  <meta property="og:image" content="https://pedrosousaeng.github.io/portfolio/assets/images/og-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CV — Pedro Sousa">
  <meta name="twitter:image" content="https://pedrosousaeng.github.io/portfolio/assets/images/og-image.png">

  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <link rel="stylesheet" href="assets/css/micro-interactions.css">

  <link rel="stylesheet" href="assets/css/page-transitions.css">
  <link rel="stylesheet" href="assets/css/svg-line-draw.css">
  <link rel="stylesheet" href="assets/css/noise.css">
  <link rel="stylesheet" href="assets/css/cv.css">
</head>
<body data-page="cv">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container nav">
      <a class="nav__brand" href="index.html">~/<span data-site="brand">pedro-sousa</span></a>
      <button class="nav__toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="primary-navigation" aria-label="Open menu">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <nav class="nav__menu" id="primary-navigation" data-nav-menu data-open="false" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="cv.html" aria-current="page">CV</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="section container" aria-labelledby="cv-heading" data-reveal>
      <div class="cv-header">
        <div class="section-heading">
          <p class="eyebrow">Résumé</p>
          <h1 id="cv-heading" class="text-3xl font-display mt-2"><span data-site="name">Pedro Sousa</span></h1>
          <p class="text-lg text-muted mt-2" data-site="role">Mechanical Engineering Student</p>
        </div>

        <div class="cv-header__actions no-print">
          <a class="btn btn--primary" href="assets/documents/cv-pedro-sousa.pdf" download>
            <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            Download CV (PDF)
          </a>

            <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
            Print version
          </button>
        </div>
      </div>

      <div class="cv-body mt-10" data-cv aria-live="polite">
        <p class="empty-state">Loading CV…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer no-print">
    <div class="container split">
      <p class="text-sm text-muted">© <span data-current-year>2026</span> <span data-site="name">Pedro Sousa</span>. Built with HTML, CSS &amp; JS.</p>
      <div class="cluster" aria-label="Social links">
        <a class="btn btn--ghost" data-social="github" href="https://github.com/PedroSousaEng" target="_blank" rel="noopener noreferrer" aria-label="GitHub (opens in a new tab)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.52 9.52 0 0 1 5 0c1.91-1.3 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.35 4.68-4.58 4.93.36.31.68.92.68 1.85v2.74c0 .26.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>
        </a>
        <a class="btn btn--ghost" data-social="email" href="mailto:pedro.sousa.engmec@gmail.com" aria-label="Send an email to Pedro Sousa">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/><path d="m3.5 6 8.5 7 8.5-7"/></svg>
        </a>
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener("click", (event) => {
      if (event.target.closest("[data-print-cv]")) window.print();
    });
  </script>
  <script type="module" src="assets/js/main.js"></script>
  <div class="noise" aria-hidden="true"></div>
</body>
</html>
